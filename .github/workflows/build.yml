name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          mkdir -p app/src/main/java/com/komalai/app
          mkdir -p app/src/main/res/{layout,values,mipmap-hdpi}
          mkdir -p gradle/wrapper

          cat > settings.gradle << 'X'
          rootProject.name="KomalAI"
          include ':app'
          X

          cat > build.gradle << 'X'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          X

          cat > app/build.gradle << 'X'
          plugins { id 'com.android.application' }
          android {
            compileSdkVersion 33
            defaultConfig {
              applicationId "com.komalai.app"
              minSdkVersion 21
              targetSdkVersion 33
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              release { minifyEnabled false; signingConfig signingConfigs.debug }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          X

          cat > gradle/wrapper/gradle-wrapper.properties << 'X'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          X

          cat > app/src/main/AndroidManifest.xml << 'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.komalai.app">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <uses-feature android:name="android.hardware.camera" android:required="false"/>
            <uses-feature android:name="android.hardware.microphone" android:required="false"/>
            <application
              android:allowBackup="true"
              android:icon="@mipmap/ic_launcher"
              android:label="Komal AI"
              android:hardwareAccelerated="true"
              android:usesCleartextTraffic="true"
              android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true"
                android:screenOrientation="portrait"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          X

          cat > app/src/main/res/values/strings.xml << 'X'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Komal AI</string></resources>
          X

          cat > app/src/main/res/values/styles.xml << 'X'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
              <item name="android:windowBackground">#0A0416</item>
              <item name="android:statusBarColor">#0A0416</item>
              <item name="android:navigationBarColor">#0A0416</item>
            </style>
          </resources>
          X

          cat > app/src/main/res/layout/activity_main.xml << 'X'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:background="#0A0416"/>
          X

          python3 -c "
          import struct,zlib
          w,h=108,108
          rows=[]
          for y in range(h):
            row=[0]
            for x in range(w):
              d=((x-w//2)**2+(y-h//2)**2)**0.5
              row+=[255,107,0,255] if d<w*0.46 else [10,4,22,255]
            rows.append(bytes(row))
          raw=b''.join(rows)
          comp=zlib.compress(raw)
          def ch(n,d):
            c=n+d; return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+ch(b'IDAT',comp)+ch(b'IEND',b'')
          open('app/src/main/res/mipmap-hdpi/ic_launcher.png','wb').write(png)
          "

          cat > app/src/main/java/com/komalai/app/MainActivity.java << 'X'
          package com.komalai.app;
          import android.Manifest;import android.app.Activity;
          import android.content.pm.PackageManager;import android.graphics.Color;
          import android.os.Build;import android.os.Bundle;
          import android.view.WindowManager;import android.webkit.*;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;import androidx.core.content.ContextCompat;
          public class MainActivity extends Activity {
            WebView w; PermissionRequest pr; static final int R=101;
            static final String URL="https://confidential-amethyst-3rt4rk3vro.edgeone.app/";
            @Override protected void onCreate(Bundle s){
              super.onCreate(s);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              w=new WebView(this); w.setBackgroundColor(Color.parseColor("#0A0416")); setContentView(w);
              WebSettings ws=w.getSettings();
              ws.setJavaScriptEnabled(true); ws.setDomStorageEnabled(true);
              ws.setMediaPlaybackRequiresUserGesture(false); ws.setDatabaseEnabled(true);
              if(Build.VERSION.SDK_INT>=21) ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient(){
                @Override public void onPermissionRequest(PermissionRequest r){
                  runOnUiThread(()->{
                    boolean c=ContextCompat.checkSelfPermission(MainActivity.this,Manifest.permission.CAMERA)==PackageManager.PERMISSION_GRANTED;
                    boolean m=ContextCompat.checkSelfPermission(MainActivity.this,Manifest.permission.RECORD_AUDIO)==PackageManager.PERMISSION_GRANTED;
                    if(!c||!m){pr=r;ActivityCompat.requestPermissions(MainActivity.this,new String[]{Manifest.permission.CAMERA,Manifest.permission.RECORD_AUDIO},R);}
                    else r.grant(r.getResources());
                  });
                }
              });
              ActivityCompat.requestPermissions(this,new String[]{Manifest.permission.CAMERA,Manifest.permission.RECORD_AUDIO},R);
              w.loadUrl(URL);
            }
            @Override public void onRequestPermissionsResult(int code,String[] p,int[] r){
              super.onRequestPermissionsResult(code,p,r);
              if(pr!=null){boolean ok=true;for(int x:r)if(x!=0){ok=false;break;}
              if(ok)pr.grant(pr.getResources());else{pr.deny();Toast.makeText(this,"Settings में Camera/Mic Allow करें",Toast.LENGTH_LONG).show();}pr=null;}
            }
            @Override public void onBackPressed(){if(w.canGoBack())w.goBack();else super.onBackPressed();}
            @Override protected void onPause(){super.onPause();w.onPause();}
            @Override protected void onResume(){super.onResume();w.onResume();}
            @Override protected void onDestroy(){w.destroy();super.onDestroy();}
          }
          X

          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v3
        with:
          name: KomalAI-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
